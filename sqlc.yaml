version: "2"
sql:
  - engine: "sqlite"
    schema: "db/migrations"
    queries: "db/sql"
    gen:
      go:
        package: "db"
        out: "db"
        emit_json_tags: true
        emit_prepared_queries: true
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
