    body: '{"messages":[{"content":"You are Rush, an interactive CLI AI coding assistant that helps users with software engineering tasks.\n\n<communication>\n## Style\n- Output text directly to users; only use tools to complete tasks\n- Short, concise responses in Github-flavored markdown\n- NO emojis unless explicitly requested\n- NEVER use bash echo or comments to communicate\n- NEVER create files unless absolutely necessary\n- ALWAYS prefer editing existing files over creating new ones\n\n## Objectivity\nPrioritize technical accuracy over validation. Focus on facts and problem-solving. Disagree when necessary. Investigate uncertainty rather than confirming beliefs. Avoid over-the-top praise like \"You''re absolutely right.\"\n\n## Planning\nProvide concrete steps without time estimates. Never say \"this will take 2-3 weeks\" or \"we can do this later.\" Focus on what needs to be done, not when.\n</communication>\n\n<task_management>\nUse TodoWrite tool VERY frequently to track tasks and give users visibility. This is EXTREMELY helpful for planning and breaking down complex tasks. If you don''t use this tool when planning, you may forget important tasks - unacceptable.\n\n**Critical**: Mark todos as completed immediately after finishing. Don''t batch completions.\n\n**Task states**:\n- `pending`: Not started\n- `in_progress`: Currently working (ONE at a time)\n- `completed`: Fully finished\n\n**Task format** - provide both forms:\n- `content`: \"Run tests\" (imperative)\n- `activeForm`: \"Running tests\" (present continuous)\n\n**Use TodoWrite when**:\n- Complex multi-step tasks (3+ steps)\n- User provides task lists\n- Planning non-trivial work\n\n**Don''t use when**:\n- Single straightforward task\n- Trivial operations (<3 steps)\n- Purely conversational\n\n**Completion rules**:\n- Only mark completed when FULLY done\n- If blocked/errors, keep in_progress\n- Never mark completed if tests fail or implementation partial\n</task_management>\n\n<workflow>\nThe user will primarily request you perform software engineering tasks. \nThis includes solving bugs, adding new functionality, refactoring code, explaining code, and more. \n\nFor these tasks the following steps are recommended:\n- Use the TodoWrite tool to plan the task if required\n- Use the AskUserQuestion tool to ask questions, clarify and gather information as needed.\n- Avoid backwards-compatibility hacks like renaming unused `_vars`, re-exporting types, adding `// removed` comments for removed code, etc. If something is unused, delete it completely.\n- Tool results and user messages may include <system-reminder> tags. <system-reminder> tags contain useful information and reminders. They are automatically added by the system, and bear no direct relation to the specific tool results or user messages in which they appear.\n\nMake one change at a time, run tests after each change, fix failures immediately, keep going until fully resolved, brief progress updates (<10 words) then continue immediately\n\n**Finishing**: Verify ENTIRE query resolved, all next steps completed, run lint/typecheck if in memory, keep response under 4 lines\n**Key behaviors**: Use find_references before changing shared code, follow existing patterns, try different approach if stuck, make decisions yourself, fix root causes, mention unrelated bugs but don''t fix them\n\n**IMPORTANT**: NEVER create files unless they''re absolutely necessary for achieving your goal. ALWAYS prefer editing an existing file to creating a new one. This includes markdown files.\n</workflow>\n\n<decisions>\n**Be autonomous** - don''t ask when you can: search, read files, check similar code, infer from context, try likely approach\n\n**Only stop/ask if**: truly ambiguous requirement, multiple approaches with big tradeoffs, could cause data loss, exhausted attempts with actual blocking errors\n\n**Never stop for**: task seems large (break it down), multiple files to change (change them), work takes many steps (do all steps), \"session limits\" (don''t exist)\n</decisions>\n\n<editing>\n**IMPORTANT**: ALWAYS read files before editing in this conversation.\n\n**Editing steps**:\n1. Read file - note EXACT indentation (spaces vs tabs, count)\n2. Copy exact text with ALL whitespace, newlines, indentation\n3. Include 3-5 lines context before/after\n4. Verify old_string appears exactly once\n5. If uncertain, include MORE context\n6. Verify edit succeeded, run tests\n\n**The Edit tool is extremely literal**. \"Close enough\" fails.\n</editing>\n\n<git>\n- NEVER update git config\n- NEVER force operations (--force, --no-verify, etc.) unless explicitly requested\n- NEVER push/commit unless user explicitly asks\n\n**Commit Workflow**:\n1. Run parallel: `git status`, `git diff`, `git log`\n2. Analyze changes, draft message (1-2 sentences, focus on \"why\")\n3. Warn if committing secrets (.env, credentials, etc.)\n4. Add files, commit with HEREDOC:\n```bash\ngit commit -m \"$(cat <<''EOF''\nMessage here\nEOF\n)\"\n```\n</git>\n\n<tools>\n- When doing file search, prefer to use the Task tool in order to reduce context usage.\n- You should proactively use the Task tool with specialized agents when the task at hand matches the agent''s description.\n- You can call multiple tools in a single response. If you intend to call multiple tools and there are no dependencies between them, make all independent tool calls in parallel. Maximize use of parallel tool calls where possible to increase efficiency. However, if some tool calls depend on previous calls to inform dependent values, do NOT call these tools in parallel and instead call them sequentially. For instance, if one operation must complete before another starts, run these operations sequentially instead. Never use placeholders or guess missing parameters in tool calls.\n- If the user specifies that they want you to run tools \"in parallel\", you MUST send a single message with multiple tool use content blocks. For example, if you need to launch multiple agents in parallel, send a single message with multiple Task tool calls.\n- Use specialized tools instead of bash commands when possible, as this provides a better user experience. For file operations, use dedicated tools: Read for reading files instead of cat/head/tail, Edit for editing instead of sed/awk, and Write for creating files instead of cat with heredoc or echo redirection. Reserve bash tools exclusively for actual system commands and terminal operations that require shell execution. NEVER use bash echo or other command-line tools to communicate thoughts, explanations, or instructions to the user. Output all communication directly in your response text instead.\n- VERY IMPORTANT: When exploring the codebase to gather context or to answer a question that is not a needle query for a specific file/class/function, it is CRITICAL that you use the Task tool with subagent_type=Explore instead of running search commands directly.\n</tools>\n\n<code>\n**Before writing**: Check if libraries exist (imports, package.json), read similar code for patterns, match existing style, follow security best practices, no one-letter variables unless requested\n\n**Conventions**: New projects = ambitious, existing = surgical/precise. Don''t rename unnecessarily. Don''t add formatters/linters/tests to codebases without them.\n\n**Testing**: Test specific to changes then broaden, use self-verification (unit tests, logs, debug), run relevant tests, fix failures immediately, check memory for commands, run lint/typecheck if available, max 3 formatter iterations, don''t fix unrelated bugs\n\n**Error handling**: Read error messages, understand root cause, try different approach, search for working code, make targeted fix, test. Keep tasks in_progress if blocked.\n\n**References**: Use `file_path:line_number` pattern: \"Auth logic in `src/auth/login.ts:45` needs updating\"\n</code>\n\n<memory>\nUpdate memory files with: build/test/lint commands, code style preferences, important patterns, useful project info\n</memory>\n\n<answers>\n**Default (under 4 lines)**: Simple questions, single-file changes, casual conversation, one-word answers when possible\n\n**More detail (up to 10-15 lines)**: Large multi-file changes, complex refactoring, when approach understanding matters, mentioning unrelated bugs, suggesting next steps\n\n**Include**: Brief what/why, key files changed (file:line), important decisions/tradeoffs, next steps/verification, issues found not fixed\n\n**Avoid**: Full file contents unless asked, explaining how to save/copy, \"Here''s what I did\" preambles, \"Let me know if...\" postambles\n</answers>\n\n<asking_questions>\nUse AskUserQuestion tool when: requirements ambiguous, multiple valid approaches need user preference, architectural decisions, edge cases discovered, need to confirm assumptions\n\nUse during execution, not just at start. Questions may arise as you work.\n</asking_questions>\n\n<env>\nWorking directory: /tmp/rush-test/TestCoderAgent/openai-gpt-5/multiedit_tool\nIs directory a git repo: no\nPlatform: linux\nToday''s date: 1/1/2025\n\n</env>\n\n\n\n","role":"system"},{"content":"use multiedit to change ''Hello, World!'' to ''Hello, Rush!'' and add a comment ''// Greeting'' above the fmt.Println line in main.go","role":"user"},{"tool_calls":[{"id":"call_3mvcWFaPZK6LfDeKlrYWVlaB","function":{"arguments":"{\"path\":\"/tmp/rush-test/TestCoderAgent/openai-gpt-5/multiedit_tool\",\"pattern\":\"**/main.go\"}","name":"glob"},"type":"function"}],"role":"assistant"},{"content":"/tmp/rush-test/TestCoderAgent/openai-gpt-5/multiedit_tool/main.go","tool_call_id":"call_3mvcWFaPZK6LfDeKlrYWVlaB","role":"tool"},{"tool_calls":[{"id":"call_Zpz0Qjv3g1uC237q20kdVkbJ","function":{"arguments":"{\"file_path\":\"/tmp/rush-test/TestCoderAgent/openai-gpt-5/multiedit_tool/main.go\"}","name":"view"},"type":"function"}],"role":"assistant"},{"content":"<file>\n     1|package main\n     2|\n     3|import \"fmt\"\n     4|\n     5|func main() {\n     6|\tfmt.Println(\"Hello, World!\")\n     7|}\n</file>\n","tool_call_id":"call_Zpz0Qjv3g1uC237q20kdVkbJ","role":"tool"}],"model":"gpt-5","max_completion_tokens":10000,"stream_options":{"include_usage":true},"tool_choice":"auto","tools":[{"function":{"name":"bash","strict":false,"description":"Executes bash commands with automatic background conversion for long-running tasks.\n\n<cross_platform>\nUses mvdan/sh interpreter (Bash-compatible on all platforms including Windows).\nUse forward slashes for paths: \"ls C:/foo/bar\" not \"ls C:\\foo\\bar\".\nCommon shell builtins and core utils available on Windows.\n</cross_platform>\n\n<execution_steps>\n1. Directory Verification: If creating directories/files, use LS tool to verify parent exists\n2. Security Check: Banned commands (alias, aria2c, axel, chrome, curl, curlie, firefox, http-prompt, httpie, links, lynx, nc, safari, scp, ssh, telnet, w3m, wget, xh, doas, su, sudo, apk, apt, apt-cache, apt-get, dnf, dpkg, emerge, home-manager, makepkg, opkg, pacman, paru, pkg, pkg_add, pkg_delete, portage, rpm, yay, yum, zypper, at, batch, chkconfig, crontab, fdisk, mkfs, mount, parted, service, systemctl, umount, firewall-cmd, ifconfig, ip, iptables, netstat, pfctl, route, ufw) return error - explain to user. Safe read-only commands execute without prompts\n3. Command Execution: Execute with proper quoting, capture output\n4. Auto-Background: Commands exceeding 1 minute automatically move to background and return shell ID\n5. Output Processing: Truncate if exceeds 30000 characters\n6. Return Result: Include errors, metadata with <cwd></cwd> tags\n</execution_steps>\n\n<usage_notes>\n- Command required, working_dir optional (defaults to current directory)\n- IMPORTANT: Use Grep/Glob/Agent tools instead of ''find''/''grep''. Use View/LS tools instead of ''cat''/''head''/''tail''/''ls''\n- Chain with '';'' or ''&&'', avoid newlines except in quoted strings\n- Each command runs in independent shell (no state persistence between calls)\n- Prefer absolute paths over ''cd'' (use ''cd'' only if user explicitly requests)\n</usage_notes>\n\n<background_execution>\n- Set run_in_background=true to run commands in a separate background shell\n- Returns a shell ID for managing the background process\n- Use job_output tool to view current output from background shell\n- Use job_kill tool to terminate a background shell\n- IMPORTANT: NEVER use `&` at the end of commands to run in background - use run_in_background parameter instead\n- Commands that should run in background:\n  * Long-running servers (e.g., `npm start`, `python -m http.server`, `node server.js`)\n  * Watch/monitoring tasks (e.g., `npm run watch`, `tail -f logfile`)\n  * Continuous processes that don''t exit on their own\n  * Any command expected to run indefinitely\n- Commands that should NOT run in background:\n  * Build commands (e.g., `npm run build`, `go build`)\n  * Test suites (e.g., `npm test`, `pytest`)\n  * Git operations\n  * File operations\n  * Short-lived scripts\n</background_execution>\n\n<git_commits>\nWhen user asks to create git commit:\n\n1. Single message with three tool_use blocks (IMPORTANT for speed):\n   - git status (untracked files)\n   - git diff (staged/unstaged changes)\n   - git log (recent commit message style)\n\n2. Add relevant untracked files to staging. Don''t commit files already modified at conversation start unless relevant.\n\n3. Analyze staged changes in <commit_analysis> tags:\n   - List changed/added files, summarize nature (feature/enhancement/bug fix/refactoring/test/docs)\n   - Brainstorm purpose/motivation, assess project impact, check for sensitive info\n   - Don''t use tools beyond git context\n   - Draft concise (1-2 sentences) message focusing on \"why\" not \"what\"\n   - Use clear language, accurate reflection (\"add\"=new feature, \"update\"=enhancement, \"fix\"=bug fix)\n   - Avoid generic messages, review draft\n\n4. Create commit using HEREDOC:\n   git commit -m \"$(cat &lt;&lt;''EOF''\n   Commit message here.\n   EOF\n   )\"\n\n5. If pre-commit hook fails, retry ONCE. If fails again, hook preventing commit. If succeeds but files modified, MUST amend.\n\n6. Run git status to verify.\n\nNotes: Use \"git commit -am\" when possible, don''t stage unrelated files, NEVER update config, don''t push, no -i flags, no empty commits, return empty response.\n</git_commits>\n\n<pull_requests>\nUse gh command for ALL GitHub tasks. When user asks to create PR:\n\n1. Single message with multiple tool_use blocks (VERY IMPORTANT for speed):\n   - git status (untracked files)\n   - git diff (staged/unstaged changes)\n   - Check if branch tracks remote and is up to date\n   - git log and ''git diff main...HEAD'' (full commit history from main divergence)\n\n2. Create new branch if needed\n3. Commit changes if needed\n4. Push to remote with -u flag if needed\n\n5. Analyze changes in <pr_analysis> tags:\n   - List commits since diverging from main\n   - Summarize nature of changes\n   - Brainstorm purpose/motivation\n   - Assess project impact\n   - Don''t use tools beyond git context\n   - Check for sensitive information\n   - Draft concise (1-2 bullet points) PR summary focusing on \"why\"\n   - Ensure summary reflects ALL changes since main divergence\n   - Clear, concise language\n   - Accurate reflection of changes and purpose\n   - Avoid generic summaries\n   - Review draft\n\n6. Create PR with gh pr create using HEREDOC:\n   gh pr create --title \"title\" --body \"$(cat &lt;&lt;''EOF''\n\n   ## Summary\n\n   &lt;1-3 bullet points>\n\n   ## Test plan\n\n   [Checklist of TODOs...]\n\n   EOF\n   )\"\n\nImportant:\n\n- Return empty response - user sees gh output\n- Never update git config\n</pull_requests>\n\n<examples>\nGood: pytest /foo/bar/tests\nBad: cd /foo/bar && pytest tests\n</examples>\n","parameters":{"properties":{"command":{"description":"The command to execute","type":"string"},"description":{"description":"A brief description of what the command does, try to keep it under 30 characters or so","type":"string"},"run_in_background":{"description":"Set to true (boolean) to run this command in the background. Use job_output to read the output later.","type":"boolean"},"working_dir":{"description":"The working directory to execute the command in (defaults to current directory)","type":"string"}},"required":["description","command"],"type":"object"}},"type":"function"},{"function":{"name":"download","strict":false,"description":"Downloads binary data from URL and saves to local file.\n\n<usage>\n- Provide URL to download from\n- Specify local file path where content should be saved\n- Optional timeout for request\n</usage>\n\n<features>\n- Downloads any file type (binary or text)\n- Auto-creates parent directories if missing\n- Handles large files efficiently with streaming\n- Sets reasonable timeouts to prevent hanging\n- Validates input parameters before requests\n</features>\n\n<limitations>\n- Max file size: 100MB\n- Only supports HTTP and HTTPS protocols\n- Cannot handle authentication or cookies\n- Some websites may block automated requests\n- Will overwrite existing files without warning\n</limitations>\n\n<tips>\n- Use absolute paths or paths relative to working directory\n- Set appropriate timeouts for large files or slow connections\n</tips>\n","parameters":{"properties":{"file_path":{"description":"The local file path where the downloaded content should be saved","type":"string"},"timeout":{"description":"Optional timeout in seconds (max 600)","type":"integer"},"url":{"description":"The URL to download from","type":"string"}},"required":["url","file_path"],"type":"object"}},"type":"function"},{"function":{"name":"edit","strict":false,"description":"Edits files by replacing text, creating new files, or deleting content. For moving/renaming use Bash ''mv''. For large edits use Write tool.\n\n<prerequisites>\n1. Use View tool to understand file contents and context\n2. For new files: Use LS tool to verify parent directory exists\n3. **CRITICAL**: Note exact whitespace, indentation, and formatting from View output\n</prerequisites>\n\n<parameters>\n1. file_path: Absolute path to file (required)\n2. old_string: Text to replace (must match exactly including whitespace/indentation)\n3. new_string: Replacement text\n4. replace_all: Replace all occurrences (default false)\n</parameters>\n\n<special_cases>\n\n- Create file: provide file_path + new_string, leave old_string empty\n- Delete content: provide file_path + old_string, leave new_string empty\n  </special_cases>\n\n<critical_requirements>\nEXACT MATCHING: The tool is extremely literal. Text must match **EXACTLY**\n\n- Every space and tab character\n- Every blank line\n- Every newline character\n- Indentation level (count the spaces/tabs)\n- Comment spacing (`// comment` vs `//comment`)\n- Brace positioning (`func() {` vs `func(){`)\n\nCommon failures:\n\n```\nExpected: \"    func foo() {\"     (4 spaces)\nProvided: \"  func foo() {\"       (2 spaces) ❌ FAILS\n\nExpected: \"}\\n\\nfunc bar() {\"    (2 newlines)\nProvided: \"}\\nfunc bar() {\"      (1 newline) ❌ FAILS\n\nExpected: \"// Comment\"           (space after //)\nProvided: \"//Comment\"            (no space) ❌ FAILS\n```\n\nUNIQUENESS (when replace_all=false): old_string MUST uniquely identify target instance\n\n- Include 3-5 lines context BEFORE and AFTER change point\n- Include exact whitespace, indentation, surrounding code\n- If text appears multiple times, add more context to make it unique\n\nSINGLE INSTANCE: Tool changes ONE instance when replace_all=false\n\n- For multiple instances: set replace_all=true OR make separate calls with unique context\n- Plan calls carefully to avoid conflicts\n\nVERIFICATION BEFORE USING: Before every edit\n\n1. View the file and locate exact target location\n2. Check how many instances of target text exist\n3. Copy the EXACT text including all whitespace\n4. Verify you have enough context for unique identification\n5. Double-check indentation matches (count spaces/tabs)\n6. Plan separate calls or use replace_all for multiple changes\n   </critical_requirements>\n\n<warnings>\nTool fails if:\n- old_string matches multiple locations and replace_all=false\n- old_string doesn''t match exactly (including whitespace)\n- Insufficient context causes wrong instance change\n- Indentation is off by even one space\n- Missing or extra blank lines\n- Wrong tabs vs spaces\n</warnings>\n\n<recovery_steps>\nIf you get \"old_string not found in file\":\n\n1. **View the file again** at the specific location\n2. **Copy more context** - include entire function if needed\n3. **Check whitespace**:\n   - Count indentation spaces/tabs\n   - Look for blank lines\n   - Check for trailing spaces\n4. **Verify character-by-character** that your old_string matches\n5. **Never guess** - always View the file to get exact text\n   </recovery_steps>\n\n<best_practices>\n\n- Ensure edits result in correct, idiomatic code\n- Don''t leave code in broken state\n- Use absolute file paths (starting with /)\n- Use forward slashes (/) for cross-platform compatibility\n- Multiple edits to same file: send all in single message with multiple tool calls\n- **When in doubt, include MORE context rather than less**\n- Match the existing code style exactly (spaces, tabs, blank lines)\n  </best_practices>\n\n<whitespace_checklist>\nBefore submitting an edit, verify:\n\n- [ ] Viewed the file first\n- [ ] Counted indentation spaces/tabs\n- [ ] Included blank lines if they exist\n- [ ] Matched brace/bracket positioning\n- [ ] Included 3-5 lines of surrounding context\n- [ ] Verified text appears exactly once (or using replace_all)\n- [ ] Copied text character-for-character, not approximated\n      </whitespace_checklist>\n\n<examples>\n✅ Correct: Exact match with context\n\n```\nold_string: \"func ProcessData(input string) error {\\n    if input == \\\"\\\" {\\n        return errors.New(\\\"empty input\\\")\\n    }\\n    return nil\\n}\"\n\nnew_string: \"func ProcessData(input string) error {\\n    if input == \\\"\\\" {\\n        return errors.New(\\\"empty input\\\")\\n    }\\n    // New validation\\n    if len(input) > 1000 {\\n        return errors.New(\\\"input too long\\\")\\n    }\\n    return nil\\n}\"\n```\n\n❌ Incorrect: Not enough context\n\n```\nold_string: \"return nil\"  // Appears many times!\n```\n\n❌ Incorrect: Wrong indentation\n\n```\nold_string: \"  if input == \\\"\\\" {\"  // 2 spaces\n// But file actually has:        \"    if input == \\\"\\\" {\"  // 4 spaces\n```\n\n✅ Correct: Including context to make unique\n\n```\nold_string: \"func ProcessData(input string) error {\\n    if input == \\\"\\\" {\\n        return errors.New(\\\"empty input\\\")\\n    }\\n    return nil\"\n```\n\n</examples>\n\n<windows_notes>\n\n- Forward slashes work throughout (C:/path/file)\n- File permissions handled automatically\n- Line endings converted automatically (\\n ↔ \\r\\n)\n  </windows_notes>\n","parameters":{"properties":{"file_path":{"description":"The absolute path to the file to modify","type":"string"},"new_string":{"description":"The text to replace it with","type":"string"},"old_string":{"description":"The text to replace","type":"string"},"replace_all":{"description":"Replace all occurrences of old_string (default false)","type":"boolean"}},"required":["file_path","old_string","new_string"],"type":"object"}},"type":"function"},{"function":{"name":"multiedit","strict":false,"description":"Makes multiple edits to a single file in one operation. Built on Edit tool for efficient multiple find-and-replace operations. Prefer over Edit tool for multiple edits to same file.\n\n<prerequisites>\n1. Use View tool to understand file contents and context\n2. Verify directory path is correct\n3. CRITICAL: Note exact whitespace, indentation, and formatting from View output\n</prerequisites>\n\n<parameters>\n1. file_path: Absolute path to file (required)\n2. edits: Array of edit operations, each containing:\n   - old_string: Text to replace (must match exactly including whitespace/indentation)\n   - new_string: Replacement text\n   - replace_all: Replace all occurrences (optional, defaults to false)\n</parameters>\n\n<operation>\n- Edits applied sequentially in provided order.\n- Each edit operates on result of previous edit.\n- PARTIAL SUCCESS: If some edits fail, successful edits are still applied. Failed edits are returned in the response.\n- File is modified if at least one edit succeeds.\n- Ideal for several changes to different parts of same file.\n</operation>\n\n<inherited_rules>\nAll instructions from the Edit tool documentation apply verbatim to every edit item:\n- Critical requirements for exact matching and uniqueness\n- Warnings and common failures (tabs vs spaces, blank lines, brace placement, etc.)\n- Verification steps before using, recovery steps, best practices, and whitespace checklist\nUse the same level of precision as Edit. Multiedit often fails due to formatting mismatches—double-check whitespace for every edit.\n</inherited_rules>\n\n<critical_requirements>\n1. Apply Edit tool rules to EACH edit (see edit.md).\n2. Edits are applied in order; successful edits are kept even if later edits fail.\n3. Plan sequence carefully: earlier edits change the file content that later edits must match.\n4. Ensure each old_string is unique at its application time (after prior edits).\n5. Check the response for failed edits and retry them if needed.\n</critical_requirements>\n\n<verification_before_using>\n1. View the file and copy exact text (including whitespace) for each target.\n2. Check how many instances each old_string has BEFORE the sequence starts.\n3. Dry-run mentally: after applying edit #N, will edit #N+1 still match? Adjust old_string/new_string accordingly.\n4. Prefer fewer, larger context blocks over many tiny fragments that are easy to misalign.\n5. If edits are independent, consider separate multiedit batches per logical region.\n</verification_before_using>\n\n<warnings>\n- Operation continues even if some edits fail; check response for failed edits.\n- Earlier edits can invalidate later matches (added/removed spaces, lines, or reordered text).\n- Mixed tabs/spaces, trailing spaces, or missing blank lines commonly cause failures.\n- replace_all may affect unintended regions—use carefully or provide more context.\n</warnings>\n\n<recovery_steps>\nIf some edits fail:\n1. Check the response metadata for the list of failed edits with their error messages.\n2. View the file again to see the current state after successful edits.\n3. Adjust the failed edits based on the new file content.\n4. Retry the failed edits with corrected old_string values.\n5. Consider breaking complex batches into smaller, independent operations.\n</recovery_steps>\n\n<best_practices>\n- Ensure all edits result in correct, idiomatic code; don''t leave code broken.\n- Use absolute file paths (starting with /).\n- Use replace_all only when you''re certain; otherwise provide unique context.\n- Match existing style exactly (spaces, tabs, blank lines).\n- Review failed edits in the response and retry with corrections.\n</best_practices>\n\n<whitespace_checklist>\nFor EACH edit, verify:\n- [ ] Viewed the file first\n- [ ] Counted indentation spaces/tabs\n- [ ] Included blank lines if present\n- [ ] Matched brace/bracket positioning\n- [ ] Included 3–5 lines of surrounding context\n- [ ] Verified text appears exactly once (or using replace_all deliberately)\n- [ ] Copied text character-for-character, not approximated\n</whitespace_checklist>\n\n<examples>\n✅ Correct: Sequential edits where the second match accounts for the first change\n\n```\nedits: [\n  {\n    old_string: \"func A() {\\n    doOld()\\n}\",\n    new_string: \"func A() {\\n    doNew()\\n}\",\n  },\n  {\n    // Uses context that still exists AFTER the first replacement\n    old_string: \"func B() {\\n    callA()\\n}\",\n    new_string: \"func B() {\\n    callA()\\n    logChange()\\n}\",\n  },\n]\n```\n\n❌ Incorrect: Second old_string no longer matches due to whitespace change introduced by the first edit\n\n```\nedits: [\n  {\n    old_string: \"func A() {\\n    doOld()\\n}\",\n    new_string: \"func A() {\\n\\n    doNew()\\n}\", // Added extra blank line\n  },\n  {\n    old_string: \"func A() {\\n    doNew()\\n}\", // Missing the new blank line, will FAIL\n    new_string: \"func A() {\\n    doNew()\\n    logChange()\\n}\",\n  },\n]\n```\n\n✅ Correct: Handling partial success\n\n```\n// If edit 2 fails, edit 1 is still applied\n// Response will indicate:\n// - edits_applied: 1\n// - edits_failed: [{index: 2, error: \"...\", edit: {...}}]\n// You can then retry edit 2 with corrected context\n```\n</examples>\n","parameters":{"properties":{"edits":{"description":"Array of edit operations to perform sequentially on the file","items":{"properties":{"new_string":{"description":"The text to replace it with","type":"string"},"old_string":{"description":"The text to replace","type":"string"},"replace_all":{"description":"Replace all occurrences of old_string (default false).","type":"boolean"}},"required":["old_string","new_string"],"type":"object"},"type":"array"},"file_path":{"description":"The absolute path to the file to modify","type":"string"}},"required":["file_path","edits"],"type":"object"}},"type":"function"},{"function":{"name":"fetch","strict":false,"description":"Fetches raw content from URL and returns it in specified format without any AI processing.\n\n<when_to_use>\nUse this tool when you need:\n- Raw, unprocessed content from a URL\n- Direct access to API responses or JSON data\n- HTML/text/markdown content without interpretation\n- Simple, fast content retrieval without analysis\n- To save tokens by avoiding AI processing\n\nDO NOT use this tool when you need to:\n- Extract specific information from a webpage (use agentic_fetch instead)\n- Answer questions about web content (use agentic_fetch instead)\n- Analyze or summarize web pages (use agentic_fetch instead)\n</when_to_use>\n\n<usage>\n- Provide URL to fetch content from\n- Specify desired output format (text, markdown, or html)\n- Optional timeout for request\n</usage>\n\n<features>\n- Supports three output formats: text, markdown, html\n- Auto-handles HTTP redirects\n- Fast and lightweight - no AI processing\n- Sets reasonable timeouts to prevent hanging\n- Validates input parameters before requests\n</features>\n\n<limitations>\n- Max response size: 5MB\n- Only supports HTTP and HTTPS protocols\n- Cannot handle authentication or cookies\n- Some websites may block automated requests\n- Returns raw content only - no analysis or extraction\n</limitations>\n\n<tips>\n- Use text format for plain text content or simple API responses\n- Use markdown format for content that should be rendered with formatting\n- Use html format when you need raw HTML structure\n- Set appropriate timeouts for potentially slow websites\n- If the user asks to analyze or extract from a page, use agentic_fetch instead\n</tips>\n","parameters":{"properties":{"format":{"description":"The format to return the content in (text, markdown, or html)","type":"string"},"timeout":{"description":"Optional timeout in seconds (max 120)","type":"integer"},"url":{"description":"The URL to fetch content from","type":"string"}},"required":["url","format"],"type":"object"}},"type":"function"},{"function":{"name":"glob","strict":false,"description":"Fast file pattern matching tool that finds files by name/pattern, returning paths sorted by modification time (newest first).\n\n<usage>\n- Provide glob pattern to match against file paths\n- Optional starting directory (defaults to current working directory)\n- Results sorted with most recently modified files first\n</usage>\n\n<pattern_syntax>\n- ''\\*'' matches any sequence of non-separator characters\n- ''\\*\\*'' matches any sequence including separators\n- ''?'' matches any single non-separator character\n- ''[...]'' matches any character in brackets\n- ''[!...]'' matches any character not in brackets\n</pattern_syntax>\n\n<examples>\n- ''*.js'' - JavaScript files in current directory\n- ''**/*.js'' - JavaScript files in any subdirectory\n- ''src/**/*.{ts,tsx}'' - TypeScript files in src directory\n- ''*.{html,css,js}'' - HTML, CSS, and JS files\n</examples>\n\n<limitations>\n- Results limited to 100 files (newest first)\n- Does not search file contents (use Grep for that)\n- Hidden files (starting with ''.'') skipped\n</limitations>\n\n<cross_platform>\n- Path separators handled automatically (/ and \\ work)\n- Uses ripgrep (rg) if available, otherwise Go implementation\n- Patterns should use forward slashes (/) for compatibility\n</cross_platform>\n\n<tips>\n- Combine with Grep: find files with Glob, search contents with Grep\n- For iterative exploration requiring multiple searches, consider Agent tool\n- Check if results truncated and refine pattern if needed\n</tips>\n","parameters":{"properties":{"path":{"description":"The directory to search in. Defaults to the current working directory.","type":"string"},"pattern":{"description":"The glob pattern to match files against","type":"string"}},"required":["pattern"],"type":"object"}},"type":"function"},{"function":{"name":"grep","strict":false,"description":"Fast content search tool that finds files containing specific text/patterns, returning matching paths sorted by modification time (newest first).\n\n<usage>\n- Provide regex pattern to search within file contents\n- Set literal_text=true for exact text with special characters (recommended for non-regex users)\n- Optional starting directory (defaults to current working directory)\n- Optional include pattern to filter which files to search\n- Results sorted with most recently modified files first\n</usage>\n\n<regex_syntax>\nWhen literal_text=false (supports standard regex):\n\n- ''function'' searches for literal text \"function\"\n- ''log\\..\\*Error'' finds text starting with \"log.\" and ending with \"Error\"\n- ''import\\s+.\\*\\s+from'' finds import statements in JavaScript/TypeScript\n  </regex_syntax>\n\n<include_patterns>\n\n- ''\\*.js'' - Only search JavaScript files\n- ''\\*.{ts,tsx}'' - Only search TypeScript files\n- ''\\*.go'' - Only search Go files\n  </include_patterns>\n\n<limitations>\n- Results limited to 100 files (newest first)\n- Performance depends on number of files searched\n- Very large binary files may be skipped\n- Hidden files (starting with ''.'') skipped\n</limitations>\n\n<ignore_support>\n\n- Respects .gitignore patterns to skip ignored files/directories\n- Respects .rushignore patterns for additional ignore rules\n- Both ignore files auto-detected in search root directory\n  </ignore_support>\n\n<cross_platform>\n\n- Uses ripgrep (rg) if available for better performance\n- Falls back to Go implementation if ripgrep unavailable\n- File paths normalized automatically for compatibility\n  </cross_platform>\n\n<tips>\n- For faster searches: use Glob to find relevant files first, then Grep\n- For iterative exploration requiring multiple searches, consider Agent tool\n- Check if results truncated and refine search pattern if needed\n- Use literal_text=true for exact text with special characters (dots, parentheses, etc.)\n</tips>\n","parameters":{"properties":{"include":{"description":"File pattern to include in the search (e.g. \"*.js\", \"*.{ts,tsx}\")","type":"string"},"literal_text":{"description":"If true, the pattern will be treated as literal text with special regex characters escaped. Default is false.","type":"boolean"},"path":{"description":"The directory to search in. Defaults to the current working directory.","type":"string"},"pattern":{"description":"The regex pattern to search for in file contents","type":"string"}},"required":["pattern"],"type":"object"}},"type":"function"},{"function":{"name":"ls","strict":false,"description":"Shows files and subdirectories in tree structure for exploring project organization.\n\n<usage>\n- Provide path to list (defaults to current working directory)\n- Optional glob patterns to ignore\n- Results displayed in tree structure\n</usage>\n\n<features>\n- Hierarchical view of files and directories\n- Auto-skips hidden files/directories (starting with ''.'')\n- Skips common system directories like __pycache__\n- Can filter files matching specific patterns\n</features>\n\n<limitations>\n- Results limited to 1000 files\n- Large directories truncated\n- No file sizes or permissions shown\n- Cannot recursively list all directories in large projects\n</limitations>\n\n<cross_platform>\n- Hidden file detection uses Unix convention (files starting with ''.'')\n- Windows hidden files (with hidden attribute) not auto-skipped\n- Common Windows directories (System32, Program Files) not in default ignore\n- Path separators handled automatically (/ and \\ work)\n</cross_platform>\n\n<tips>\n- Use Glob for finding files by name patterns instead of browsing\n- Use Grep for searching file contents\n- Combine with other tools for effective exploration\n</tips>\n","parameters":{"properties":{"depth":{"description":"The maximum depth to traverse","type":"integer"},"ignore":{"description":"List of glob patterns to ignore","items":{"type":"string"},"type":"array"},"path":{"description":"The path to the directory to list (defaults to current working directory)","type":"string"}},"required":[],"type":"object"}},"type":"function"},{"function":{"name":"sourcegraph","strict":false,"description":"Search code across public repositories using Sourcegraph''s GraphQL API.\n\n<usage>\n- Provide search query using Sourcegraph syntax\n- Optional result count (default: 10, max: 20)\n- Optional timeout for request\n</usage>\n\n<basic_syntax>\n- \"fmt.Println\" - exact matches\n- \"file:.go fmt.Println\" - limit to Go files\n- \"repo:^github\\.com/golang/go$ fmt.Println\" - specific repos\n- \"lang:go fmt.Println\" - limit to Go code\n- \"fmt.Println AND log.Fatal\" -